name: ARCO - APK Android Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        run: |
          flutter create . --platforms=android --org com.arcoanalytics --project-name arco_analytics
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.arcoanalytics.app"', s)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.arcoanalytics.app"', s)
              s = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", 'applicationId "com.arcoanalytics.app"', s)
              p.write_text(s)
          PY
          flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-APK-v0.5
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
