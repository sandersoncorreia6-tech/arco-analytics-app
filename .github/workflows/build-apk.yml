name: Build ARCO APK (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Reconstruir e validar fonte oficial v0.4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = sorted(Path(".source/v0_4").glob("part*.b64"))
          assert parts, "Partes da fonte oficial não encontradas"
          raw = base64.b64decode("".join(p.read_text().strip() for p in parts))
          Path("arco.zip").write_bytes(raw)
          digest = hashlib.sha256(raw).hexdigest()
          expected = "247421b7dfbf944fcd7cbd4d7c5a775d7afe01443b322a08d578d0934ee7fd6d"
          assert digest == expected, f"SHA256 inválido: {digest}"
          print("Fonte oficial validada:", digest)
          PY
          unzip -q arco.zip

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Android
        working-directory: arco_analytics
        run: flutter create . --platforms=android --org com.arcoanalytics --project-name arco_analytics

      - name: Instalar dependências
        working-directory: arco_analytics
        run: flutter pub get

      - name: Gerar APK
        working-directory: arco_analytics
        run: flutter build apk --release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-APK
          path: arco_analytics/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
