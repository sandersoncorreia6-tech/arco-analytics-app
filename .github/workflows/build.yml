name: ARCO Build

# Gera APK, AAB e Web/PWA a cada push (qualquer branch) e sob demanda.
# Windows e iOS (sem assinatura) só rodam na main ou manualmente.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Análise + testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK + AAB
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Conferir permissão de internet no AndroidManifest
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml \
            || (echo "::error::AndroidManifest sem permissão INTERNET: FPB/LBC não sincronizariam no APK" && exit 1)

      - name: Assinatura de produção (opcional)
        id: signing
        env:
          ARCO_KEYSTORE_BASE64: ${{ secrets.ARCO_KEYSTORE_BASE64 }}
          ARCO_KEYSTORE_PASSWORD: ${{ secrets.ARCO_KEYSTORE_PASSWORD }}
          ARCO_KEY_ALIAS: ${{ secrets.ARCO_KEY_ALIAS }}
          ARCO_KEY_PASSWORD: ${{ secrets.ARCO_KEY_PASSWORD }}
        run: |
          if [ -n "$ARCO_KEYSTORE_BASE64" ] && [ -n "$ARCO_KEYSTORE_PASSWORD" ] && [ -n "$ARCO_KEY_ALIAS" ] && [ -n "$ARCO_KEY_PASSWORD" ]; then
            echo "$ARCO_KEYSTORE_BASE64" | base64 --decode > android/app/arco-upload-keystore.jks
            {
              echo "storePassword=$ARCO_KEYSTORE_PASSWORD"
              echo "keyPassword=$ARCO_KEY_PASSWORD"
              echo "keyAlias=$ARCO_KEY_ALIAS"
              echo "storeFile=arco-upload-keystore.jks"
            } > android/key.properties
            echo "kind=assinado" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets de assinatura ausentes: o APK será assinado com chave de teste (debug). Ele instala normalmente, mas não atualiza uma instalação feita com a chave oficial."
            echo "kind=teste" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get

      - name: Gerar APK
        run: flutter build apk --release

      - name: Gerar AAB
        run: flutter build appbundle --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-APK-${{ steps.signing.outputs.kind }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-AAB-${{ steps.signing.outputs.kind }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web + PWA
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # ARCO_PROXY_BASE_URL (Settings → Secrets and variables → Variables): URL do
      # deploy Vercel com /api, necessária quando a Web é publicada fora da Vercel.
      - name: Gerar Web/PWA
        run: flutter build web --release --dart-define=ARCO_PROXY_BASE_URL=${{ vars.ARCO_PROXY_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-Web-PWA
          path: build/web
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create . --platforms=windows --org com.arcoanalytics --project-name arco_analytics
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-Windows
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (sem assinatura)
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter create . --platforms=ios --org com.arcoanalytics --project-name arco_analytics
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Empacotar Runner.app
        run: cd build/ios/iphoneos && zip -qry ARCO-iOS-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-iOS-unsigned
          path: build/ios/iphoneos/ARCO-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 14
