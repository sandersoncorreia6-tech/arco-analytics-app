name: ARCO - Build Multiplataforma

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - "lib/**"
      - "web/**"
      - "api/**"
      - "pubspec.yaml"
      - "analysis_options.yaml"
      - ".github/workflows/build-all-platforms.yml"

permissions:
  contents: read

concurrency:
  group: arco-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Testes
        shell: bash
        run: |
          if [ -d test ] && find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "Nenhum teste automatizado encontrado ainda."
          fi

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar arquivos Android
        run: flutter create . --platforms=android --org com.arcoanalytics --project-name arco_analytics

      - name: Fixar Application ID
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for name in ("android/app/build.gradle.kts", "android/app/build.gradle"):
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text()
              s = re.sub(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.arcoanalytics.app"', s)
              s = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.arcoanalytics.app"', s)
              s = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", 'applicationId "com.arcoanalytics.app"', s)
              p.write_text(s)
          PY

      - name: Dependências
        run: flutter pub get

      - name: Gerar APK release
        run: flutter build apk --release

      - name: Gerar AAB release
        run: flutter build appbundle --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-APK-v0.6
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publicar AAB
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-AAB-v0.6
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  web:
    name: Web + PWA
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preservar PWA customizado
        run: cp -R web /tmp/arco-web

      - name: Criar arquivos Web
        run: flutter create . --platforms=web --org com.arcoanalytics --project-name arco_analytics

      - name: Restaurar PWA customizado
        run: |
          rm -rf web
          cp -R /tmp/arco-web web

      - name: Dependências
        run: flutter pub get

      - name: Gerar Web/PWA
        run: flutter build web --release

      - name: Publicar Web/PWA
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Web-PWA-v0.6
          path: build/web
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar Windows
        run: |
          flutter config --enable-windows-desktop
          flutter create . --platforms=windows --org com.arcoanalytics --project-name arco_analytics
          flutter pub get

      - name: Gerar Windows
        run: flutter build windows --release

      - name: Publicar Windows
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-Windows-v0.6
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error

  ios:
    name: iOS unsigned
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar iOS
        run: |
          flutter create . --platforms=ios --org com.arcoanalytics --project-name arco_analytics
          flutter pub get

      - name: Gerar iOS sem assinatura
        run: flutter build ios --release --no-codesign

      - name: Compactar app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app ARCO-iOS-unsigned.zip

      - name: Publicar iOS
        uses: actions/upload-artifact@v4
        with:
          name: ARCO-iOS-Unsigned-v0.6
          path: ARCO-iOS-unsigned.zip
          if-no-files-found: error
