name: Bootstrap organizacao v0.5

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/bootstrap-organize-v05.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch de organizacao
        uses: actions/checkout@v4
        with:
          ref: organize-v0.5
          fetch-depth: 0

      - name: Extrair fonte mais desenvolvida
        shell: bash
        run: |
          set -euo pipefail
          test -f arco_analytics_v0_5_coach_hub.zip
          rm -rf /tmp/arco-v05
          mkdir -p /tmp/arco-v05
          unzip -q arco_analytics_v0_5_coach_hub.zip -d /tmp/arco-v05
          PUBSPEC="$(find /tmp/arco-v05 -type f -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          SOURCE_DIR="$(dirname "$PUBSPEC")"
          echo "Fonte: $SOURCE_DIR"
          rsync -a --exclude '.git/' --exclude '.github/workflows/' "$SOURCE_DIR/" ./
          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Documentar estrutura
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/REPOSITORY_STRUCTURE.md <<'DOC'
          # Estrutura oficial do ARCO Analytics

          A fonte Flutter fica diretamente na raiz do repositório.

          - `lib/`: aplicação, telas, modelos, estado e serviços
          - `web/`: Web/PWA
          - `api/`: integrações/proxies
          - `docs/`: documentação técnica e de produto
          - `scripts/`: automações de build/release
          - `.github/workflows/`: CI/CD

          ## Regra de desenvolvimento
          O código-fonte na raiz é a fonte oficial. ZIPs e fragmentos Base64 são legados temporários de migração e não devem receber novas funcionalidades.
          DOC

      - name: Commit na branch organize-v0.5
        shell: bash
        run: |
          git config user.name "ARCO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
            exit 0
          fi
          git commit -m "Organiza ARCO v0.5 como codigo-fonte na raiz"
          git push origin HEAD:organize-v0.5
