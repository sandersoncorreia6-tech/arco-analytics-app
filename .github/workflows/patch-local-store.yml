name: ARCO - Patch persistencia local

on:
  push:
    branches: [ organize-v0.5 ]
    paths:
      - ".github/workflows/patch-local-store.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: organize-v0.5
          fetch-depth: 0

      - name: Integrar armazenamento local
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/state/app_state.dart')
          s = p.read_text()

          def rep(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'Padrão ausente: {label}')
              s = s.replace(old, new, 1)

          rep(
              "import '../services/coach_schedule_service.dart';",
              "import '../services/coach_schedule_service.dart';\nimport '../services/local_game_store.dart';",
              'import store',
          )
          rep(
              "    _restoreLbcCache();\n    syncFpbNow();",
              "    _restoreLbcCache();\n    _restoreSavedGames();\n    syncFpbNow();",
              'restore no construtor',
          )
          rep(
              "  final CoachScheduleService _coachScheduleService = const CoachScheduleService();\n  final TeamContext teamContext = TeamContext.tupaMonstrinho2026;",
              "  final CoachScheduleService _coachScheduleService = const CoachScheduleService();\n  final LocalGameStore _localGameStore = LocalGameStore();\n  final TeamContext teamContext = TeamContext.tupaMonstrinho2026;",
              'campo store',
          )

          marker = "  Future<void> syncFpbNow({bool silent = false}) async {"
          methods = "\n".join([
              "  Future<void> _restoreSavedGames() async {",
              "    final saved = await _localGameStore.load();",
              "    games.removeWhere((game) => game.source != 'mock');",
              "    games.insertAll(0, saved.where((game) => game.source != 'mock'));",
              "    notifyListeners();",
              "  }",
              "",
              "  Future<void> _persistRealGames() async {",
              "    final realGames = games.where((game) => game.source != 'mock').toList();",
              "    await _localGameStore.save(realGames);",
              "  }",
              "",
          ])
          if marker not in s:
              raise SystemExit('Marcador syncFpbNow ausente')
          s = s.replace(marker, methods + marker, 1)

          rep(
              "    games.insert(0, game);\n    activeGame = null;",
              "    games.insert(0, game);\n    unawaited(_persistRealGames());\n    activeGame = null;",
              'persistir ao finalizar',
          )

          p.write_text(s)
          PY

      - name: Commit
        run: |
          git config user.name "ARCO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/state/app_state.dart
          git commit -m "Persiste scouts concluídos no dispositivo"
          git push origin HEAD:organize-v0.5
