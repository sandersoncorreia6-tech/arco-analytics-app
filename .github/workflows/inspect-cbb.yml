name: Inspect CBB schedule endpoint

on:
  push:
    paths:
      - '.github/workflows/inspect-cbb.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public CBB calendar assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/js
          curl -L --retry 2 --max-time 30 -A 'Mozilla/5.0 ARCO-Analytics' 'https://www.cbb.com.br/calendario' -o out/calendar.html
          python3 - <<'PY'
          import re, html, pathlib, urllib.parse, urllib.request
          raw=pathlib.Path('out/calendar.html').read_text(errors='ignore')
          srcs=re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)', raw, re.I)
          base='https://www.cbb.com.br/calendario'
          lines=[]
          for i,src in enumerate(srcs):
              url=urllib.parse.urljoin(base, html.unescape(src))
              lines.append(url)
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 ARCO-Analytics'})
                  data=urllib.request.urlopen(req, timeout=20).read()
                  pathlib.Path(f'out/js/{i}.js').write_bytes(data)
              except Exception as e:
                  lines.append(f'ERROR {url}: {e}')
          pathlib.Path('out/scripts.txt').write_text('\n'.join(lines))
          PY
          {
            echo '=== SCRIPT URLS ==='
            cat out/scripts.txt
            echo
            echo '=== API / CALENDAR CANDIDATES ==='
            grep -RhoE 'https?://[^"'\'' )]+|/[A-Za-z0-9_./?=&{}:-]*(api|calendar|calendario|game|games|partida|partidas|competition|competicao|sportRadar|sportradar)[A-Za-z0-9_./?=&{}:-]*' out/js out/calendar.html 2>/dev/null | sort -u | head -n 1000 || true
            echo
            echo '=== CONTEXT ==='
            grep -RniE 'sportradar|calendario|calendar|partidas|games|competitions|competicoes' out/js 2>/dev/null | head -n 500 || true
          } > out/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-endpoint-inspection
          path: out/
          retention-days: 1
