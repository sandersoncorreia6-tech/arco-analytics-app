name: Inspect CBB schedule endpoint

on:
  push:
    paths:
      - '.github/workflows/inspect-cbb.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Probe FPB U16 match range
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import pathlib, urllib.request, urllib.error, urllib.parse, json
          base='https://api.cbb.com.br/v1/matches/range'
          cid='a0c20e2d-5283-11ef-bfb0-df3fdaddb2d0'
          variants=[
            {'competitionId':cid,'org':'fpb','fromDate':'2026-01-01','toDate':'2026-12-31'},
            {'competitionId':cid,'org':'fpb','from':'2026-01-01','to':'2026-12-31'},
            {'competitionId':cid,'league':'fpb','from':'2026-01-01','to':'2026-12-31'},
            {'competitionId':cid,'league':'fpb','startDate':'2026-01-01','endDate':'2026-12-31'},
            {'competitionId':cid,'org':'fpb','startDate':'2026-01-01','endDate':'2026-12-31'},
            {'competition_id':cid,'org':'fpb','from_date':'2026-01-01','to_date':'2026-12-31'},
            {'competition':cid,'org':'fpb','from':'2026-01-01','to':'2026-12-31'},
            {'competition':cid,'league':'fpb','from':'2026-01-01','to':'2026-12-31'},
            {'competitionId':cid,'provider':'fpb','fromDate':'2026-01-01','toDate':'2026-12-31'},
            {'competitionId':cid,'organization':'fpb','fromDate':'2026-01-01','toDate':'2026-12-31'},
            {'competitionId':cid,'source':'fpb','fromDate':'2026-01-01','toDate':'2026-12-31'},
            {'competitionId':cid,'league':'fpb','dateFrom':'2026-01-01','dateTo':'2026-12-31'},
            {'competitionId':cid,'org':'fpb','dateFrom':'2026-01-01','dateTo':'2026-12-31'},
            {'competitionId':cid,'org':'fpb','start':'2026-01-01','end':'2026-12-31'},
          ]
          report=[]
          for i,q in enumerate(variants):
              url=base+'?'+urllib.parse.urlencode(q)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ARCO-Analytics','Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as resp:
                      body=resp.read(); code=resp.status
              except urllib.error.HTTPError as e:
                  code=e.code; body=e.read()
              except Exception as e:
                  code='ERR'; body=str(e).encode()
              pathlib.Path(f'out/{i}.txt').write_bytes(body)
              preview=body[:500].decode(errors='replace').replace('\n',' ')
              report.append({'i':i,'code':code,'bytes':len(body),'query':q,'preview':preview})
          pathlib.Path('out/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-range-probe
          path: out/
          retention-days: 1
