name: Inspect CBB schedule endpoint

on:
  push:
    paths:
      - '.github/workflows/inspect-cbb.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Call public CBB calendar Server Action
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL='https://www.cbb.com.br/calendario'
          ACTION='7fa44f483f0a4da7815d44be667b13a23d4fc7bc44'
          BODY='[{"competitionId":"a0c20e2d-5283-11ef-bfb0-df3fdaddb2d0","org":"fpb","fromDate":"2026-01-01","toDate":"2026-12-31"}]'
          python3 - <<'PY'
          import subprocess, pathlib, json
          url='https://www.cbb.com.br/calendario'
          action='7fa44f483f0a4da7815d44be667b13a23d4fc7bc44'
          body='[{"competitionId":"a0c20e2d-5283-11ef-bfb0-df3fdaddb2d0","org":"fpb","fromDate":"2026-01-01","toDate":"2026-12-31"}]'
          trees=[
            None,
            '["",{"children":["calendario",{"children":["__PAGE__",{}]}]},null,null,true]',
            '["",{"children":["calendario",{"children":["__PAGE__?{}",{}]}]},null,null,true]',
          ]
          report=[]
          for i,tree in enumerate(trees):
              args=['curl','-L','-sS','--max-time','30','-D',f'out/{i}.headers','-o',f'out/{i}.body',
                    '-X','POST',url,
                    '-H','User-Agent: Mozilla/5.0 ARCO-Analytics',
                    '-H','Accept: text/x-component',
                    '-H',f'Next-Action: {action}',
                    '-H','Content-Type: text/plain;charset=UTF-8',
                    '--data-binary',body]
              if tree:
                  args += ['-H',f'Next-Router-State-Tree: {tree}']
              p=subprocess.run(args,capture_output=True,text=True)
              b=pathlib.Path(f'out/{i}.body').read_bytes() if pathlib.Path(f'out/{i}.body').exists() else b''
              h=pathlib.Path(f'out/{i}.headers').read_text(errors='ignore') if pathlib.Path(f'out/{i}.headers').exists() else ''
              report.append({'i':i,'returncode':p.returncode,'tree':tree,'bytes':len(b),'hasTupa':b'TUP' in b.upper(),'headers':h[-1200:],'preview':b[:3500].decode(errors='replace')})
          pathlib.Path('out/report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cbb-server-action-probe
          path: out/
          retention-days: 1
