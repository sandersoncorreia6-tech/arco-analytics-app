name: Organizar fonte v0.5

on:
  push:
    branches:
      - organize-v0.5
    paths:
      - ".github/workflows/organize-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          ref: organize-v0.5
          fetch-depth: 0

      - name: Extrair v0.5 para a raiz
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arco-v05
          mkdir -p /tmp/arco-v05
          unzip -q arco_analytics_v0_5_coach_hub.zip -d /tmp/arco-v05

          PUBSPEC="$(find /tmp/arco-v05 -type f -name pubspec.yaml -print -quit)"
          test -n "$PUBSPEC"
          SOURCE_DIR="$(dirname "$PUBSPEC")"
          echo "Fonte encontrada em: $SOURCE_DIR"

          rsync -a             --exclude '.git/'             --exclude '.github/workflows/'             "$SOURCE_DIR/" ./

          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Criar documentação da organização
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/REPOSITORY_STRUCTURE.md <<'DOC'
          # Estrutura do repositório ARCO Analytics

          Este repositório usa o código-fonte Flutter diretamente na raiz.

          ## Diretórios principais
          - lib/: aplicação Flutter
          - web/: PWA/Web
          - api/: integrações/proxies web
          - docs/: documentação
          - .github/workflows/: CI/CD
          - scripts/: automações de build/release

          ## Regra
          Novas versões devem alterar o código-fonte diretamente. ZIPs e fontes Base64 são mantidos apenas temporariamente durante a migração e não devem ser a fonte oficial de build.
          DOC

      - name: Commit da estrutura organizada
        shell: bash
        run: |
          git config user.name "ARCO Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi
          git commit -m "Organiza código-fonte v0.5 na raiz do repositório"
          git push origin HEAD:organize-v0.5
