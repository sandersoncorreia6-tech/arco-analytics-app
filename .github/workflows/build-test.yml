name: ARCO Build/Test

# Em todo push e pull request: análise, testes, Web/PWA e APK de teste.
on:
  push:
    paths-ignore: ['**.md', 'docs/**', '*.txt', 'supabase/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    name: Análise + testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    name: Web + PWA
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # ARCO_PROXY_BASE_URL (Settings → Variables): deploy Vercel com /api, quando a Web é publicada fora dela.
      - run: flutter build web --release --dart-define=ARCO_PROXY_BASE_URL=${{ vars.ARCO_PROXY_BASE_URL }} --dart-define=ARCO_SUPABASE_URL=${{ vars.ARCO_SUPABASE_URL }} --dart-define=ARCO_SUPABASE_ANON_KEY=${{ vars.ARCO_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-Web-PWA
          path: build/web
          if-no-files-found: error
          retention-days: 30

  apk:
    name: APK de teste
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Conferir permissão de internet e Application ID
        run: |
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || (echo "::error::AndroidManifest sem INTERNET" && exit 1)
          grep -q 'applicationId = "com.arcoanalytics.app"' android/app/build.gradle.kts || (echo "::error::Application ID alterado" && exit 1)
      - run: flutter pub get
      # Sem key.properties o release é assinado com a chave de debug (não atualiza a versão oficial).
      - run: flutter build apk --release --dart-define=ARCO_SUPABASE_URL=${{ vars.ARCO_SUPABASE_URL }} --dart-define=ARCO_SUPABASE_ANON_KEY=${{ vars.ARCO_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-APK-teste
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
