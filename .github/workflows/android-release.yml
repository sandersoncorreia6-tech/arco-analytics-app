name: ARCO Android Release

# APK + AAB assinados com a chave oficial (GitHub Secrets).
# Rodar manualmente (Actions → ARCO Android Release → Run workflow) ou criar uma tag v*.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: APK + AAB assinados
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Conferir Application ID
        run: grep -q 'applicationId = "com.arcoanalytics.app"' android/app/build.gradle.kts || (echo "::error::Application ID alterado" && exit 1)

      - name: Restaurar chave de assinatura (GitHub Secrets)
        env:
          ARCO_KEYSTORE_BASE64: ${{ secrets.ARCO_KEYSTORE_BASE64 }}
          ARCO_KEYSTORE_PASSWORD: ${{ secrets.ARCO_KEYSTORE_PASSWORD }}
          ARCO_KEY_ALIAS: ${{ secrets.ARCO_KEY_ALIAS }}
          ARCO_KEY_PASSWORD: ${{ secrets.ARCO_KEY_PASSWORD }}
        run: |
          for v in ARCO_KEYSTORE_BASE64 ARCO_KEYSTORE_PASSWORD ARCO_KEY_ALIAS ARCO_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v ausente. Configure em Settings → Secrets and variables → Actions."; exit 1; fi
          done
          echo "$ARCO_KEYSTORE_BASE64" | base64 --decode > android/app/arco-upload-keystore.jks
          {
            echo "storePassword=$ARCO_KEYSTORE_PASSWORD"
            echo "keyPassword=$ARCO_KEY_PASSWORD"
            echo "keyAlias=$ARCO_KEY_ALIAS"
            echo "storeFile=arco-upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --dart-define=ARCO_SUPABASE_URL=${{ vars.ARCO_SUPABASE_URL }} --dart-define=ARCO_SUPABASE_ANON_KEY=${{ vars.ARCO_SUPABASE_ANON_KEY }}
      - run: flutter build appbundle --release --dart-define=ARCO_SUPABASE_URL=${{ vars.ARCO_SUPABASE_URL }} --dart-define=ARCO_SUPABASE_ANON_KEY=${{ vars.ARCO_SUPABASE_ANON_KEY }}

      - name: Apagar a chave do runner
        if: always()
        run: rm -f android/app/arco-upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: ARCO-Android-Release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
